      <p class="text-slate-400">เลือกออปชั่นที่ได้จากอุปกรณ์แต่ละช่อง ระบบจะคำนวณคะแนน 1-10 ดาวจากข้อมูลของ <a href="https://rozerodb.com/tools/affixes" class="text-blue-400 hover:underline" target="_blank">RozeroDB</a> และ <a href="https://midgardhub.com/tools/affix" class="text-blue-400 hover:underline" target="_blank">MidgardHub</a></p>

const sourceSel = document.getElementById('sourceSel');
const seriesSel = document.getElementById('seriesSel');
const slotsContainer = document.getElementById('slotsContainer');
const starRow = document.getElementById('starRow');
const scoreNum = document.getElementById('scoreNum');
const gradeLabel = document.getElementById('gradeLabel');
const detailScore = document.getElementById('detailScore');

function parseRange(r) {
  const m = String(r).match(/(-?\d+(?:\.\d+)?)\s*[-~]\s*(-?\d+(?:\.\d+)?)/);
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0,0];
}

function poolWeight(pool) {
  if (pool == null) return 1.25;
  if (pool >= 5) return 1.25;
  if (pool === 4) return 1.15;
  return 1.0 + pool * 0.05;
}
function slotWeight(slot) {
  const s = parseInt(slot);
  if (s === 4) return 1.5;
  if (s === 3) return 1.25;
  if (s === 2) return 1.1;
  return 1.0;
}
const sourceLabels = {
  'Monster Drop': 'ดรอปจากมอนสเตอร์',
  'MVP Drop': 'ดรอปจาก MVP',
  'Blacksmith Forging': 'ตีเหล็ก Blacksmith',
  'Activation System': 'ระบบ Activation',
  'Glast Heim': 'Glast Heim'
};
const seriesLabels = {
  'Armor': 'เกราะ',
  'Garment': 'ผ้าคลุม',
  'Magic Series': 'สายเวท',
  'Melee Series': 'สายตีระยะใกล้',
  'Ranged Series': 'สายตีระยะไกล',
  'Shoes': 'รองเท้า',
  'Forging Weapons': 'อาวุธที่ตีเหล็ก',
  'Physical Series': 'สายกายภาพ'
};
function populateSources() {
  sourceSel.innerHTML = '';
  Object.keys(AFFIX_DATA).forEach(s => {
    const opt = document.createElement('option'); opt.value = s; opt.textContent = sourceLabels[s] || s; sourceSel.appendChild(opt);
  });
  populateSeries();
}
function populateSeries() {
  const src = sourceSel.value;
  seriesSel.innerHTML = '';
  Object.keys(AFFIX_DATA[src] || {}).forEach(s => {
    const opt = document.createElement('option'); opt.value = s; opt.textContent = seriesLabels[s] || s; seriesSel.appendChild(opt);
  });
  buildSlots();
}
function buildSlots() {
  const src = sourceSel.value;
  const series = seriesSel.value;
  const slots = AFFIX_DATA[src]?.[series] || {};
  slotsContainer.innerHTML = '';
  Object.entries(slots).forEach(([slotNum, options]) => {
    const card = document.createElement('div');
    card.className = 'slot-card p-4';
    const optsCount = options.length;
    card.innerHTML = `
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-lg">ช่อง ${slotNum}</h3>
        <span class="text-xs text-slate-400">${optsCount} ตัวเลือก</span>
      </div>
      <div class="mb-3">
        <label class="block text-xs text-slate-400 mb-1">ออปชั่น</label>
        <select class="affix-select w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm" data-slot="${slotNum}">
          <option value="">-- เลือกออปชั่น --</option>
          ${options.map(o => `<option value="${escapeHtml(o.name)}" data-pool="${o.pool ?? ''}" data-roll="${escapeHtml(o.roll)}">${escapeHtml(o.name)} (${o.roll})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">ค่าที่สุ่มได้</label>
        <div class="flex items-center gap-2">
          <input type="number" step="any" class="roll-input w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm" data-slot="${slotNum}" placeholder="0" />
          <span class="range-text text-xs text-slate-400 whitespace-nowrap">-</span>
        </div>
        <input type="range" class="roll-slider w-full mt-2 accent-blue-500" data-slot="${slotNum}" min="0" max="100" step="0.1" />
      </div>
    `;
    slotsContainer.appendChild(card);
  });
  attachListeners();
  calculate();
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function attachListeners() {
  document.querySelectorAll('.affix-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const opt = sel.options[sel.selectedIndex];
      const rollInput = document.querySelector(`.roll-input[data-slot="${sel.dataset.slot}"]`);
      const slider = document.querySelector(`.roll-slider[data-slot="${sel.dataset.slot}"]`);
      const rangeText = rollInput.nextElementSibling;
      const range = parseRange(opt.dataset.roll || '0-0');
      rollInput.min = range[0]; rollInput.max = range[1];
      slider.min = range[0]; slider.max = range[1]; slider.value = range[0];
      rangeText.textContent = range[0] === range[1] ? range[0] : `${range[0]} - ${range[1]}`;
      if (!rollInput.value) rollInput.value = range[0];
      calculate();
    });
  });
  document.querySelectorAll('.roll-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const slider = document.querySelector(`.roll-slider[data-slot="${inp.dataset.slot}"]`);
      const v = parseFloat(inp.value) || 0;
      if (slider) slider.value = v;
      calculate();
    });
  });
  document.querySelectorAll('.roll-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const inp = document.querySelector(`.roll-input[data-slot="${slider.dataset.slot}"]`);
      inp.value = slider.value;
      calculate();
    });
  });
}
function calculate() {
  let total = 0, maxTotal = 0, filled = 0;
  document.querySelectorAll('#slotsContainer .slot-card').forEach(card => {
      const slot = card.querySelector('.affix-select').dataset.slot;
    const sel = card.querySelector('.affix-select');
    const inp = card.querySelector('.roll-input');
    if (!sel.value) return;
    const opt = sel.options[sel.selectedIndex];
    const range = parseRange(opt.dataset.roll || '0-0');
    const min = range[0], max = range[1];
    let v = parseFloat(inp.value);
    if (Number.isNaN(v)) v = min;
    v = Math.max(min, Math.min(max, v));
    const pct = max === min ? 1 : (v - min) / (max - min);
    const pool = opt.dataset.pool === '' ? null : parseInt(opt.dataset.pool);
    const pw = poolWeight(pool);
    const sw = slotWeight(slot);
    total += pct * pw * sw;
    maxTotal += pw * sw;
    filled++;
  });
  let score = 0;
  if (filled > 0 && maxTotal > 0) score = (total / maxTotal) * 10;
  renderStars(score, filled, maxTotal);
}
function renderStars(score, filled, maxTotal) {
  scoreNum.textContent = score.toFixed(2);
  starRow.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const s = document.createElement('span');
    s.className = 'star' + (i <= Math.round(score) ? ' on' : '');
    s.textContent = '★';
    starRow.appendChild(s);
  }
  let label = '';
  if (filled === 0) label = 'ยังไม่ได้เลือกออปชั่น';
  else if (score >= 9.5) label = 'สุดยอด (God Roll)';
  else if (score >= 8.5) label = 'เยี่ยม';
  else if (score >= 7) label = 'ดีมาก';
  else if (score >= 5.5) label = 'ดี';
  else if (score >= 4) label = 'ปานกลาง';
  else if (score >= 2) label = 'ต่ำกว่ามาตรฐาน';
  else label = 'แย่';
  gradeLabel.textContent = label;
  detailScore.textContent = filled > 0 ? `คิดจาก ${filled} ช่อง / คะแนนเต็ม ${maxTotal.toFixed(2)}` : '';
}

sourceSel.addEventListener('change', populateSeries);
seriesSel.addEventListener('change', buildSlots);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('.affix-select').forEach(s => s.value = '');
  document.querySelectorAll('.roll-input').forEach(i => i.value = '');
  calculate();
});

populateSources();
